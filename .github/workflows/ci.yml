name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      # Covers the whole tree (infra/lean/ and the shared infra/modules/),
      # not just the composition validated below.
      - run: terraform fmt -check -recursive
        working-directory: infra
      # infra/lean/ is the only composition left (SDD.md changelog #036 --
      # the unapplied, never-verified-against-real-AWS production/App Runner
      # composition was removed). It needs no variable values to validate
      # and has no backend block (deliberately local state), so this needs
      # no -backend-config either.
      - run: terraform init -backend=false
        working-directory: infra/lean
      - run: terraform validate
        working-directory: infra/lean
